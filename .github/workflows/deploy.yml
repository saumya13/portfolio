name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages every time something is pushed to main.
# One-time setup: in the repo go to Settings → Pages → Build and deployment → Source and choose "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

# The permissions the Pages deployment needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces one still waiting, but never cancels one that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site (github.com/<user>/<repo>) is served from /<repo>/; a user site (<user>.github.io) from /.
      - name: Work out the base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      # The site uses client-side routing (/about, /work/…). GitHub Pages has no rewrite rules, but it serves 404.html for
      # unknown paths, so a copy of index.html there lets the app load and route on a direct visit or a refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
